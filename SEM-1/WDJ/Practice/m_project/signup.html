<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign Up - Elite Gym</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="auth-page container">
<h2>Sign Up</h2>
<form id="signupForm">
<label>Name: <input type="text" id="sname" required></label>
<label>Email: <input type="email" id="semail" required></label>
<label>Password: <input type="password" id="spassword" required></label>
<button class="btn" type="submit">Create Account</button>
</form>
<p>Already registered? <a href="login.html">Login</a></p>
<div id="signupMsg" class="info"></div>
</main>
<script src="js/auth.js"></script>
</body>
</html>
