<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-black">
    <div class="container text-white">
        <div class="heading w-screen bg-zinc-900 text-4xl py-10 text-center">
            Library Management System
        </div>
        <!-- bg-[url('https://example.com/your-image.jpg')] -->
        <div class="buttons flex w-screen justify-center gap-10 mt-10 background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRVxtsaxq2duEAoZCnHeD48mmvaaJrj1HJy-g&s');">
            <button class="bg-zinc-800 py-5 px-7 font-medium rounded-lg hover:scale-105 shadow-white hover:cursor-pointer">
                <img src="https://img.icons8.com/?size=30&id=7819&format=png&color=000000" alt=""> 
                Student Profile
            </button>
            <button class="bg-zinc-800 py-5 px-7 font-medium rounded-lg hover:scale-105 shadow-white hover:cursor-pointer">
                <img src="https://img.icons8.com/?size=30&id=undefined&format=png&color=000000" alt="">
                Book Category
            </button>
            <button id="issue-book" onclick="issueBook()" class="bg-zinc-800 py-5 px-7 font-medium rounded-lg hover:scale-105 shadow-white hover:cursor-pointer">
                <img src="https://img.icons8.com/?size=30&id=41414&format=png&color=000000" alt="">
                Issue Book
            </button>
            <button id="return-book" onclick="returnBook()" class="bg-zinc-800 py-5 px-7 font-medium rounded-lg hover:scale-105 shadow-white hover:cursor-pointer">
                <img src="https://img.icons8.com/?size=30&id=Utu32Z-yKkor&format=png&color=000000" alt="">
                return Book
            </button>
            <button class="bg-zinc-800 py-5 px-7 font-medium rounded-lg hover:scale-105 shadow-white hover:cursor-pointer">
                <img src="https://img.icons8.com/?size=30&id=undefined&format=png&color=000000" alt="" class="text-center">
                About us
            </button>
        </div>

        <div id="output"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
